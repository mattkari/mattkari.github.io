# Checks every pull request before it can reach main, where a push deploys
# the site: lint, a full static build, and the browser tests against that build.
#
# To switch this on, copy this file to .github/workflows/ci.yml. It is kept
# here because workflow files have to be added by someone with permission to
# change the repository's workflows.
name: Checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Articles are in step with the registry
        run: python3 scripts/apply-article-chrome.py --check
      - name: Lint
        run: npm run lint
      - name: Build
        env:
          # A placeholder so the contact form renders enabled; the tests answer
          # its requests themselves and nothing is sent to the mail service.
          NEXT_PUBLIC_WEB3FORMS_ACCESS_KEY: test-key
        run: npm run build
      - name: Install the test browser
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        run: npm test
      - name: Upload the test report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
